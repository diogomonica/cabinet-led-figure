<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cabinet LED Wiring</title></head><body>
<style>
/* one figure card, always on the dark bench */
:root{--page:#0b0b0b;--text:#a3a3a3;color-scheme:dark}

.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}


body{margin:0;background:var(--page);color:var(--text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(760px,100% - 32px);margin:64px auto 96px}
</style>
<div class="iso" id="iso-root" data-theme="dark"><main class="iso-page"><style>
.cab path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.cab-case{stroke:var(--anatomy-mid);stroke-width:2.5}
.iso[data-theme="light"] .cab-case{stroke:var(--anatomy-hi)}
.cab-core{stroke-width:1.4}
.cab[data-c="red"] .cab-core{stroke:var(--anatomy-red)}
.cab[data-c="black"] .cab-core{stroke:var(--cab-black)}
.cab[data-c="sheath"] .cab-case{stroke-width:3.6}.cab[data-c="sheath"] .cab-core{stroke:var(--cab-black);stroke-width:2.5}
.cab[data-c="sheath-white"] .cab-case{stroke:var(--anatomy-mid);stroke-width:3.2}.cab[data-c="sheath-white"] .cab-core{stroke:var(--cab-white);stroke-width:2.1}
.cab[data-c="collar"] .cab-core{stroke:var(--anatomy-mid);stroke-width:1.6}.cab[data-c="collar"] .cab-case{stroke-width:2.7}
.cab[data-c="ferrule"] .cab-case{stroke:var(--anatomy-mid);stroke-width:1.8}.cab[data-c="ferrule"] .cab-core{stroke:var(--cab-tin);stroke-width:.9}
.cab-cu{fill:none;stroke:var(--cab-copper);stroke-width:1.2;stroke-linecap:butt}
.iso{--cab-black:#2e2e30;--cab-white:#bdbdbd;--cab-tin:#9a9a9a;--cab-copper:#c08a52;--led-on:#ff5a52;--glow:#ffd98a;--diffuser:#fff1cf}
.iso[data-theme="light"]{--cab-black:#2a2a2e;--cab-white:#f6f6f4;--cab-tin:#c4c4c8;--cab-copper:#b5773b;--led-on:#e5484d;--glow:#ffcf6b;--diffuser:#fff6e0}
.led{fill:var(--anatomy-lo);stroke:var(--anatomy-mid);stroke-width:.4}
.led[data-on]{fill:var(--anatomy-green);stroke:none}
.led-red[data-on]{fill:var(--led-on)}
.iso-svg [data-part="shelly-led"]{fill:var(--anatomy-blue);stroke:none}
.pad{fill:var(--anatomy-hi);stroke:none;opacity:0}
.hubring{fill:none;stroke:var(--anatomy-blue);stroke-width:1.4}
.hubring[data-down]{stroke:var(--led-on)}
.hubwave{fill:none;stroke:var(--anatomy-blue);stroke-width:.8}
.pulse{fill:var(--anatomy-lit);stroke:var(--anatomy-red);stroke-width:1.2}
[data-part="diffuser-lit"] .iso-fill,[data-part="diffuser-lit"] .iso-top,[data-part="diffuser-lit"] .iso-shade{fill:var(--diffuser)!important}
.pool{fill:var(--glow);filter:blur(16px);mix-blend-mode:screen}
.iso[data-theme="light"] .pool{mix-blend-mode:multiply;filter:blur(18px)}
.iso-stage{outline:none;cursor:pointer}
.iso-stage:focus-visible{box-shadow:0 0 0 1px var(--anatomy-mid)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.controls button{font:11px/1 var(--anatomy-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--anatomy-strong);background:var(--anatomy-card);border:1px solid var(--anatomy-mid);padding:8px 11px;cursor:pointer}
.controls button:hover{border-color:var(--anatomy-hi)}
.controls button[aria-pressed="true"]{color:var(--led-on);border-color:var(--led-on)}
.note{font:11px/1.4 var(--anatomy-mono);color:var(--anatomy-text);min-height:1.4em;margin-left:4px}

`;

const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const $ = (name) => svg.querySelector('[data-part="' + name + '"]');
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const parts = { lit: $("diffuser-lit"), leds: $("leds"), pool: $("pool"), relay: $("relay"), relayLed: $("relay-led"), shellyLed: $("shelly-led"), pad: $("pad"), hub: $("hub-led"), wave: $("hub-wave"), a: $("pulse-a"), b: $("pulse-b") };
const paths = { sig: svg.querySelector('[data-path="sig"]'), com: svg.querySelector('[data-path="com"]') };
const buttons = { tap: document.querySelector('[data-act="tap"]'), ha: document.querySelector('[data-act="ha"]'), wifi: document.querySelector('[data-act="wifi"]') };

// the model of §4: sensor level → relay → SW level; Shelly in Edge switch mode flips on every SW change
const M = { sensor: false, relay: false, sw: false, light: false, wifi: true, ha: false, edges: 0, haToggles: 0, note: "" };
const SLOW = 40;            // the drawing runs the chain about 40× slower than the hardware
const T = { wire: 0.55, relay: 0.012, shelly: 0.008, ha: 0.25 };
let queue = [], clock = 0, glow = 0, padFlash = 0, shellyFlash = 0, hubFlash = 0, wave = 0, click = 0;
const later = (dt, fn) => queue.push({ at: clock + dt, fn });
const pulses = [];
const send = (path, dur, el, done) => pulses.push({ path, el, t: 0, dur, done });

function tap() {
  M.sensor = !M.sensor; padFlash = 1;
  M.note = M.sensor ? "sensor out+ rises to 12 V" : "sensor out+ falls to 0 V";
  send(paths.sig, T.wire, parts.a, () => later(T.relay * SLOW, () => {
    M.relay = M.sensor; M.sw = M.relay; click = 1;
    M.note = M.sw ? "relay closes COM–NO: SW pulled to 0 V" : "relay opens: SW released";
    send(paths.com, T.wire * 0.7, parts.b, () => later(T.shelly * SLOW, () => {
      M.light = !M.light; M.edges++; shellyFlash = 1;
      M.note = "edge on SW → Shelly flips the output";
      if (M.wifi) later(T.ha * 4, () => { M.ha = M.light; hubFlash = 0.6; M.note = "Shelly pushes the new state to HA"; });
    }));
  }));
}
function ha() {
  if (!M.wifi) { M.note = "HA can't reach the Shelly · the sensor still works"; hubFlash = 1; return; }
  hubFlash = 1; wave = 1; M.note = "HA sends toggle over Wi-Fi";
  later(T.ha * 3, () => { M.light = !M.light; M.ha = M.light; M.haToggles++; shellyFlash = 1; M.note = "Shelly flips the output; SW level unchanged"; });
}
function wifi() {
  M.wifi = !M.wifi;
  if (M.wifi) { M.note = "Wi-Fi back"; later(0.8, () => { M.ha = M.light; hubFlash = 0.6; M.note = "HA resyncs from the Shelly"; }); }
  else M.note = "Wi-Fi down · local control continues";
}
const ACT = { tap, ha, wifi };

function text() {
  const sync = !M.wifi ? "HA offline" : M.ha === M.light ? "HA in sync" : "HA syncing";
  return "light " + (M.light ? "ON" : "off") + " · sensor " + (M.sensor ? "on" : "off") + " · SW " + (M.sw ? "closed" : "open") + " · " + sync;
}
let lastText = "";
function draw() {
  parts.lit.setAttribute("opacity", glow.toFixed(3));
  parts.leds.setAttribute("opacity", (0.25 + 0.75 * glow).toFixed(3));
  parts.pool.setAttribute("opacity", (glow * 0.9).toFixed(3));
  parts.relayLed.toggleAttribute("data-on", M.relay);
  parts.relay.setAttribute("transform", click > 0 ? "translate(0 " + (-0.5 * Math.sin(click * Math.PI)).toFixed(2) + ")" : "");
  parts.shellyLed.style.opacity = (0.35 + 0.65 * Math.max(shellyFlash, M.light ? 0.5 : 0)).toFixed(2);
  parts.pad.style.opacity = (padFlash * 0.95).toFixed(2);
  parts.hub.toggleAttribute("data-down", !M.wifi);
  parts.hub.style.opacity = (0.45 + 0.55 * hubFlash).toFixed(2);
  const w = 1 - wave;
  parts.wave.setAttribute("opacity", (wave * 0.8).toFixed(2));
  parts.wave.setAttribute("transform", wave > 0 ? waveTransform(w) : "");
  for (const p of [parts.a, parts.b]) p.setAttribute("opacity", "0");
  for (const p of pulses) {
    const pt = p.path.getPointAtLength(p.path.getTotalLength() * Math.min(1, p.t / p.dur));
    p.el.setAttribute("cx", pt.x.toFixed(1)); p.el.setAttribute("cy", pt.y.toFixed(1));
    p.el.setAttribute("opacity", "1");
  }
  const t = text() + (M.note ? "  —  " + M.note : "");
  if (t !== lastText) { readout.textContent = text(); document.querySelector("[data-note]").textContent = M.note || " "; lastText = t; }
  buttons.wifi.textContent = M.wifi ? "Wi-Fi: on" : "Wi-Fi: off";
  buttons.wifi.setAttribute("aria-pressed", String(!M.wifi));
  stage.setAttribute("aria-valuetext", text());
}
const HUB_C = [555.9908465556657,180.2754866902086];
const waveTransform = (w) => { const s = 1 + w * 1.6; return "translate(" + HUB_C[0] + " " + HUB_C[1] + ") scale(" + s.toFixed(3) + ") translate(" + -HUB_C[0] + " " + -HUB_C[1] + ")"; };

const TOUR = ["tap", "ha", "tap", "tap", "ha", "ha", "wifi", "tap", "tap", "wifi"];
let frame = 0, last = 0, visible = false, touring = true, tourClock = 1.2, tourStep = 0, idleTimer = 0;
const busy = () => queue.length > 0 || pulses.length > 0;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now; clock += dt;
  const calm = still.matches;
  if (touring) { tourClock -= dt; if (tourClock <= 0 && !busy()) { ACT[TOUR[tourStep++ % TOUR.length]](); tourClock = 2.4; } }
  for (const p of pulses.slice()) { p.t += calm ? p.dur : dt; if (p.t >= p.dur) { pulses.splice(pulses.indexOf(p), 1); p.done(); } }
  for (const q of queue.slice()) if (calm || clock >= q.at) { queue.splice(queue.indexOf(q), 1); q.fn(); }
  const target = M.light ? 1 : 0;
  glow = calm ? target : glow + (target - glow) * (1 - Math.exp(-dt / 0.16));
  if (Math.abs(glow - target) < 0.002) glow = target;
  const fade = (v, tau) => (calm ? 0 : Math.max(0, v - dt / tau));
  padFlash = fade(padFlash, 0.7); shellyFlash = fade(shellyFlash, 0.6); hubFlash = fade(hubFlash, 0.8); wave = fade(wave, 0.7); click = fade(click, 0.12);
  draw();
  const settled = !touring && !busy() && glow === target && !padFlash && !shellyFlash && !hubFlash && !wave && !click;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
function act(name) {
  touring = false; clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { touring = !still.matches; tourClock = 0.5; run(); }, 9000);
  ACT[name](); run();
}
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
if (still.matches) touring = false;
for (const [name, el] of Object.entries(buttons)) el.addEventListener("click", () => act(name));
const SENSOR_C = [458.7089888764089,157.74481060903375], HUB_TOP = HUB_C;
stage.addEventListener("click", (event) => {
  const box = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  const x = ((event.clientX - box.left) / box.width) * vb.width, y = ((event.clientY - box.top) / box.height) * vb.height;
  const near = (c) => Math.hypot(c[0] - x, c[1] - y) < 26;
  if (near(SENSOR_C)) act("tap"); else if (near(HUB_TOP)) act("ha");
});
stage.addEventListener("keydown", (event) => {
  const name = { s: "tap", S: "tap", " ": "tap", h: "ha", H: "ha", w: "wifi", W: "wifi" }[event.key];
  if (!name) return; event.preventDefault(); act(name);
});
draw();
</script>
